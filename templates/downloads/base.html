{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-3">
            <!-- Sidebar -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Filter Notes</h5>
                </div>
                <div class="card-body">
                    <form method="get" action="{% url 'downloads:note_list' %}">
                        <div class="mb-3">
                            <label class="form-label">Search</label>
                            <input type="text" name="query" class="form-control" 
                                   placeholder="Search notes..." value="{{ request.GET.query }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select">
                                <option value="">All Categories</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if request.GET.category == cat.id|stringformat:"s" %}selected{% endif %}>
                                    {{ cat.name }} ({{ cat.note_count }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Level</label>
                            <select name="level" class="form-select">
                                <option value="">All Levels</option>
                                <option value="beginner" {% if request.GET.level == 'beginner' %}selected{% endif %}>Beginner</option>
                                <option value="intermediate" {% if request.GET.level == 'intermediate' %}selected{% endif %}>Intermediate</option>
                                <option value="advanced" {% if request.GET.level == 'advanced' %}selected{% endif %}>Advanced</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-search me-2"></i>Apply Filters
                        </button>
                        <a href="{% url 'downloads:note_list' %}" class="btn btn-outline-secondary w-100 mt-2">
                            <i class="fas fa-redo me-2"></i>Reset
                        </a>
                    </form>
                </div>
            </div>
            
            <!-- Categories -->
            <div class="card">
                <div class="card-header bg-light">
                    <h6 class="mb-0"><i class="fas fa-folder me-2"></i>Categories</h6>
                </div>
                <div class="list-group list-group-flush">
                    <a href="{% url 'downloads:note_list' %}" 
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center {% if not category %}active{% endif %}">
                        All Notes
                        <span class="badge bg-primary rounded-pill">{{ total_notes }}</span>
                    </a>
                    {% for cat in categories %}
                    <a href="{% url 'downloads:notes_by_category' cat.slug %}" 
                       class="list-group-item list-group-item-action d-flex justify-content-between align-items-center {% if category.slug == cat.slug %}active{% endif %}">
                        <i class="{{ cat.icon }} me-2"></i>{{ cat.name }}
                        <span class="badge bg-primary rounded-pill">{{ cat.note_count }}</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
        
        <div class="col-lg-9">
            {% block downloads_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
